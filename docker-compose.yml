services:
  in-label-pdf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: in-label-pdf
    restart: unless-stopped
    ports:
      - "5003:5003"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - PORT=5003
    volumes:
      - qc_data:/app/server/data
    networks:
      - app-network
      - tunnel-master_tunnel-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5003/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  qc_data:
    driver: local

networks:
  app-network:
    driver: bridge
  tunnel-master_tunnel-net:
    external: true
